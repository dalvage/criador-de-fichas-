<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Criador de Ficha de Jogador</title>
  
  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Silkscreen&family=Rubik:wght@700;900&display=swap" rel="stylesheet">
  
  <!-- Biblioteca para gerar PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #111a22;
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 20px 10px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-container {
      display: flex;
      gap: 30px;
      max-width: 1000px;
      width: 100%;
      align-items: flex-start;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Painel de Edição e Ações */
    .editor-panel {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      flex: 1;
      min-width: 300px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .editor-panel h2 {
      font-size: 1.3rem;
      margin-bottom: 16px;
      color: #38bdf8;
      text-align: center;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #94a3b8;
      font-weight: 600;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      -webkit-appearance: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: #38bdf8;
      outline: none;
    }

    .attributes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .attr-input-box {
      background: #0f172a;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #334155;
    }

    .attr-input-box label {
      font-size: 0.78rem;
      color: #cbd5e1;
      display: block;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .attr-input-box input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #475569;
      color: #fff;
      padding: 6px 4px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 1rem;
      text-align: center;
    }

    /* Botões de Ação */
    .actions-panel {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.2s, transform 0.1s;
      font-size: 1rem;
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .btn-pdf { background-color: #e11d48; color: #fff; }
    .btn-save { background-color: #0284c7; color: #fff; }
    .btn-upload { background-color: #10b981; color: #fff; display: block; }
    
    input[type="file"] { display: none; }

    /* Pré-visualização */
    .preview-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      min-width: 320px;
      width: 100%;
      padding-bottom: 20px;
    }

    /* Elemento que será transformado em PDF */
    #card-to-pdf {
      width: 320px;
      background-color: #1e475b;
      border-radius: 18px;
      padding: 22px 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: top center;
    }

    .card-inner {
      background: #ffffff;
      width: 100%;
      padding: 20px 18px;
      clip-path: polygon(
        22px 0%, calc(100% - 22px) 0%, 
        100% 22px, 100% calc(100% - 22px), 
        calc(100% - 22px) 100%, 22px 100%, 
        0% calc(100% - 22px), 0% 22px
      );
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-header { display: flex; flex-direction: column; gap: 4px; }

    .player-name {
      font-family: 'Rubik', sans-serif;
      font-size: 1.9rem;
      font-weight: 900;
      color: #1e475b;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      line-height: 1;
      word-break: break-word;
    }

    .country-tag { display: flex; align-items: center; gap: 8px; }
    .country-flag { font-size: 1.5rem; line-height: 1; }
    
    .country-name {
      font-family: 'Rubik', sans-serif;
      font-weight: 900;
      font-size: 1.25rem;
      color: #15803d;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .attributes-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    .attribute-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .attribute-label {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e475b;
    }

    .hexagon-badge {
      width: 44px;
      height: 36px;
      background-color: #2ec4b6;
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-family: 'Rubik', sans-serif;
      font-weight: 900;
      font-size: 1.15rem;
      letter-spacing: -0.5px;
    }

    .badge-green  { background-color: #20b2aa; }
    .badge-orange { background-color: #f58220; }
    .badge-red    { background-color: #eb4d4b; }

    .card-footer {
      margin-top: 14px;
      width: 100%;
      text-align: center;
    }

    .playstyle-text {
      font-family: 'Silkscreen', monospace;
      color: #ced6e0;
      font-size: 1.05rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 0 1px rgba(255,255,255,0.4);
      word-break: break-word;
    }

    /* Ajustes específicos para telas mobile pequenas */
    @media (max-width: 680px) {
      .app-container {
        flex-direction: column;
        align-items: center;
      }

      .editor-panel {
        order: 2;
        width: 100%;
        max-width: 100%;
      }

      .preview-container {
        order: 1;
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Pré-visualização da Ficha -->
    <div class="preview-container">
      <div id="card-to-pdf">
        <div class="card-inner">
          <div class="card-header">
            <div class="player-name" id="view-name">FERREIRA</div>
            <div class="country-tag">
              <span class="country-flag" id="view-flag">🇧🇷</span>
              <span class="country-name" id="view-country">BRAZIL</span>
            </div>
          </div>

          <div class="attributes-list" id="view-attributes-list">
            <!-- Gerado via JavaScript -->
          </div>
        </div>

        <div class="card-footer">
          <div class="playstyle-text" id="view-playstyle">COUNTER ATTACK</div>
        </div>
      </div>
    </div>

    <!-- Painel de Configurações -->
    <div class="editor-panel">
      <h2>Editor da Ficha</h2>

      <div class="form-group">
        <label>Nome do Jogador</label>
        <input type="text" id="input-name" value="FERREIRA">
      </div>

      <div style="display: grid; grid-template-columns: 75px 1fr; gap: 10px;">
        <div class="form-group">
          <label>Bandeira</label>
          <input type="text" id="input-flag" value="🇧🇷">
        </div>
        <div class="form-group">
          <label>País</label>
          <input type="text" id="input-country" value="BRAZIL">
        </div>
      </div>

      <div class="form-group">
        <label>Posição</label>
        <select id="input-position">
          <option value="linha">Jogador de Linha</option>
          <option value="goleiro">Goleiro</option>
        </select>
      </div>

      <div class="form-group">
        <label>Estilo / Subtítulo</label>
        <input type="text" id="input-playstyle" value="COUNTER ATTACK">
      </div>

      <label style="font-size: 0.85rem; color: #94a3b8; font-weight: 600;">Atributos (Aceita negativos como -2)</label>
      <div class="attributes-grid" id="attr-inputs-container">
        <!-- Gerado via JavaScript -->
      </div>

      <!-- PAINEL DE AÇÕES -->
      <div class="actions-panel">
        <button class="btn btn-pdf" id="btn-download-pdf">📄 Baixar Ficha em PDF</button>
        <button class="btn btn-save" id="btn-save-data">💾 Salvar Dados (.json)</button>
        
        <label for="input-upload-data" class="btn btn-upload">📁 Carregar Dados (.json)</label>
        <input type="file" id="input-upload-data" accept=".json">
      </div>

    </div>

  </div>

  <script>
    const attributeTemplates = {
      linha: [
        { id: "vel", label: "Velocidade", default: 5 },
        { id: "tec", label: "Técnica", default: 6 },
        { id: "cab", label: "Cabeceio", default: 3 },
        { id: "pas", label: "Passe", default: 5 },
        { id: "res", label: "Resiliência", default: 2 },
        { id: "fin", label: "Finalização", default: 3 },
        { id: "div", label: "Dividida", default: 4 },
        { id: "rea", label: "Reação", default: 4 }
      ],
      goleiro: [
        { id: "vel", label: "Velocidade", default: 4 },
        { id: "tec", label: "Pulo", default: 6 },
        { id: "cab", label: "Habilidade Aérea", default: 5 },
        { id: "pas", label: "Passe", default: 4 },
        { id: "res", label: "Resiliência", default: 3 },
        { id: "fin", label: "Defesa", default: 6 },
        { id: "div", label: "Firmeza", default: 5 },
        { id: "rea", label: "Reação", default: 5 }
      ]
    };

    let currentValues = {};

    function getBadgeClass(value) {
      if (value >= 5) return 'badge-green';
      if (value >= 3) return 'badge-orange';
      return 'badge-red'; // Valores menores que 3, incluindo 0 e negativos (-1, -2...)
    }

    function renderInputs() {
      const position = document.getElementById('input-position').value;
      const attributes = attributeTemplates[position];
      const container = document.getElementById('attr-inputs-container');
      container.innerHTML = '';

      attributes.forEach(attr => {
        if (currentValues[attr.id] === undefined) {
          currentValues[attr.id] = attr.default;
        }

        const box = document.createElement('div');
        box.className = 'attr-input-box';
        box.innerHTML = `
          <label>${attr.label}</label>
          <input type="number" step="1" value="${currentValues[attr.id]}" data-id="${attr.id}">
        `;

        box.querySelector('input').addEventListener('input', (e) => {
          const val = e.target.value;
          if (val === '-' || val === '') {
            currentValues[attr.id] = val;
          } else {
            currentValues[attr.id] = parseInt(val, 10) || 0;
          }
          renderCard();
        });

        container.appendChild(box);
      });
    }

    function renderCard() {
      document.getElementById('view-name').textContent = document.getElementById('input-name').value || 'JOGADOR';
      document.getElementById('view-flag').textContent = document.getElementById('input-flag').value;
      document.getElementById('view-country').textContent = document.getElementById('input-country').value || 'PAÍS';
      document.getElementById('view-playstyle').textContent = document.getElementById('input-playstyle').value || 'ESTILO';

      const position = document.getElementById('input-position').value;
      const attributes = attributeTemplates[position];
      const listContainer = document.getElementById('view-attributes-list');
      listContainer.innerHTML = '';

      attributes.forEach(attr => {
        let val = currentValues[attr.id] !== undefined ? currentValues[attr.id] : attr.default;
        const numVal = parseInt(val, 10) || 0;
        const colorClass = getBadgeClass(numVal);

        const row = document.createElement('div');
        row.className = 'attribute-row';
        row.innerHTML = `
          <span class="attribute-label">${attr.label}</span>
          <div class="hexagon-badge ${colorClass}">${val}</div>
        `;
        listContainer.appendChild(row);
      });
    }

    ['input-name', 'input-flag', 'input-country', 'input-playstyle'].forEach(id => {
      document.getElementById(id).addEventListener('input', renderCard);
    });

    document.getElementById('input-position').addEventListener('change', () => {
      renderInputs();
      renderCard();
    });

    // Inicialização
    renderInputs();
    renderCard();

    /* =========================================
       SISTEMA DE DOWNLOAD PDF E UPLOAD JSON 
       ========================================= */

    // 1. Download de PDF Otimizado para Mobile
    document.getElementById('btn-download-pdf').addEventListener('click', () => {
      const element = document.getElementById('card-to-pdf');
      const nomeJogador = document.getElementById('input-name').value.trim() || 'Jogador';
      const btn = document.getElementById('btn-download-pdf');
      
      btn.textContent = '⏳ Gerando PDF...';
      btn.disabled = true;

      const opt = {
        margin: 0,
        filename: `Ficha_${nomeJogador}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { 
          scale: 3, 
          useCORS: true, 
          scrollY: 0,
          scrollX: 0
        },
        jsPDF: { 
          unit: 'px', 
          format: [320, element.offsetHeight], 
          orientation: 'portrait' 
        }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        btn.textContent = '📄 Baixar Ficha em PDF';
        btn.disabled = false;
      }).catch(err => {
        console.error(err);
        btn.textContent = '📄 Baixar Ficha em PDF';
        btn.disabled = false;
        alert('Houve um problema ao gerar o PDF. Tente novamente.');
      });
    });

    // 2. Salvar Ficha (JSON)
    document.getElementById('btn-save-data').addEventListener('click', () => {
      const fichaData = {
        name: document.getElementById('input-name').value,
        flag: document.getElementById('input-flag').value,
        country: document.getElementById('input-country').value,
        position: document.getElementById('input-position').value,
        playstyle: document.getElementById('input-playstyle').value,
        attributes: currentValues
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(fichaData));
      const downloadAnchorNode = document.createElement('a');
      downloadAnchorNode.setAttribute("href", dataStr);
      downloadAnchorNode.setAttribute("download", `Ficha_Dados_${fichaData.name}.json`);
      document.body.appendChild(downloadAnchorNode);
      downloadAnchorNode.click();
      downloadAnchorNode.remove();
    });

    // 3. Carregar Ficha (Upload JSON)
    document.getElementById('input-upload-data').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const loadedData = JSON.parse(e.target.result);
          
          document.getElementById('input-name').value = loadedData.name || '';
          document.getElementById('input-flag').value = loadedData.flag || '';
          document.getElementById('input-country').value = loadedData.country || '';
          document.getElementById('input-position').value = loadedData.position || 'linha';
          document.getElementById('input-playstyle').value = loadedData.playstyle || '';
          
          currentValues = loadedData.attributes || {};
          
          renderInputs();
          renderCard();
          
          alert("Ficha carregada com sucesso!");
        } catch (error) {
          alert("Arquivo inválido!");
        }
      };
      reader.readAsText(file);
      this.value = '';
    });
  </script>
</body>
</html>
